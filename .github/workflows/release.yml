name: Release

on:
  push:
    tags:
      # Fork releases start at v2. The fork also carries upstream's v1 tags,
      # and pushing one of those must not publish a fork release.
      - "v[2-9].*"
      - "v[1-9][0-9].*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Same gate as CI — see Justfile `check`.
      - name: just check
        run: just check
        env:
          GIT_CEILING_DIRECTORIES: /

      - name: Extract release notes
        id: notes
        run: |
          heading=$(sed -n 's/^## //p' CHANGELOG.md | head -n1)
          if [ "$heading" != "$GITHUB_REF_NAME" ]; then
            echo "::error::CHANGELOG.md starts with '$heading', not '$GITHUB_REF_NAME'"
            exit 1
          fi
          notes=$(bash scripts/release-notes.sh)
          {
            echo "RELEASE_HEADER<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}

  # A release created with GITHUB_TOKEN starts no workflow on its own,
  # so the release tests run as a job of this workflow.
  test-release:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/test-release.yml
    with:
      version: ${{ github.ref_name }}
