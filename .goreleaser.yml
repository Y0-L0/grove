version: 2

project_name: grove

builds:
  - id: gw
    dir: .
    main: ./cmd/gw
    binary: gw
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/nicksenap/grove/cmd.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "gw_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

nfpms:
  - id: deb
    package_name: grove
    ids:
      - gw
    vendor: stadimeter
    homepage: https://github.com/Y0-L0/grove
    maintainer: "y0-l0 <jojo.dev@lohmer.com>"
    description: "Git Worktree Workspace Orchestrator"
    license: MIT
    formats:
      - deb
    bindir: /usr/bin

release:
  header: |
    {{ .Env.RELEASE_HEADER }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - name: grove
    # A write deploy key of homebrew-tap; gh can create it, and it does not expire.
    repository:
      owner: y0-l0
      name: homebrew-tap
      git:
        url: git@github.com:Y0-L0/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Casks
    homepage: https://github.com/Y0-L0/grove
    description: "Git Worktree Workspace Orchestrator"
    license: MIT
    binaries:
      - gw

publishers:
  - name: fury
    ids:
      - deb
    checksum: false
    signature: false
    dir: "{{ dir .ArtifactPath }}"
    cmd: >-
      curl --silent --show-error --fail
      -F package=@{{ .ArtifactName }}
      https://{{ .Env.FURY_TOKEN }}@push.fury.io/{{ .Env.FURY_ACCOUNT }}/
